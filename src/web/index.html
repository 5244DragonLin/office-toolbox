<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>office-toolbox · 个人办公工具箱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%A7%B0%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --border: #e3e6ea;
    --text: #1f2329; --muted: #7a828e; --accent: #2f6fed;
    --accent-bg: #eef3fe; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: var(--card); border-bottom: 1px solid var(--border); }
  .topbar .logo { font-size: 18px; font-weight: 600; }
  .topbar .sub { font-size: 12px; color: var(--muted); }
  .topbar .btn-back { display: none; padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; color: var(--text); }
  .topbar .btn-back:hover { background: var(--accent-bg); }
  .topbar .btn-settings { margin-left: auto; padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; color: var(--text); }
  .topbar .btn-settings:hover, .topbar .btn-settings.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }

  .view { max-width: 1080px; margin: 0 auto; padding: 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; transition: all .15s; }
  .card:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(47,111,237,.08); transform: translateY(-2px); }
  .card .name { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card .desc { font-size: 13px; color: var(--muted); margin: 8px 0 12px; line-height: 1.6; }
  .card .actions { font-size: 12px; color: var(--accent); background: var(--accent-bg); border-radius: 6px; padding: 4px 10px; display: inline-block; }
  .empty { text-align: center; color: var(--muted); padding: 80px 0; }

  .tool-layout { display: flex; gap: 20px; align-items: flex-start; }
  .tool-side { width: 240px; flex-shrink: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .tool-side .t-item { padding: 12px 16px; cursor: pointer; font-size: 14px; border-bottom: 1px solid var(--border); }
  .tool-side .t-item:hover { background: var(--accent-bg); }
  .tool-side .t-item.active { background: var(--accent-bg); font-weight: 600; position: relative; }
  .tool-side .t-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
  .tool-side .t-item .t-desc { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 400; }
  .tool-main { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .tool-main h2 { font-size: 17px; margin-bottom: 6px; }
  .tool-main .hint { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; margin-bottom: 6px; font-weight: 500; }
  .field input[type=text], .field input[type=number], .field select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .drop { border: 2px dashed var(--border); border-radius: 10px; padding: 26px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; transition: all .15s; }
  .drop:hover, .drop.drag { border-color: var(--accent); background: var(--accent-bg); }
  .drop .file-list { margin-top: 10px; text-align: left; color: var(--text); }
  .drop .file-list div { font-size: 12px; padding: 2px 0; }
  .f-remove { cursor: pointer; color: #c0392b; margin-left: 8px; font-weight: 600; user-select: none; }
  .f-remove:hover { text-decoration: underline; }
  .btn { margin-top: 8px; padding: 10px 22px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn-mini { padding: 6px 12px; background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; font-size: 13px; cursor: pointer; }
  .btn-mini:hover { background: var(--accent); color: #fff; }
  .btn-mini.danger { background: #fdecec; color: #c0392b; border-color: #eab6b2; }
  .btn-mini.danger:hover { background: #c0392b; border-color: #c0392b; color: #fff; }
  .btn-mini:disabled { opacity: .5; cursor: not-allowed; }
  #audioPreview audio { width: 100%; display: block; margin: 6px 0 10px; }
  .audio-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .audio-toolbar .at-time { font-size: 13px; font-weight: 600; color: var(--text); min-width: 120px; }
  .audio-toolbar .at-tip { font-size: 12px; color: #1f7a3d; }
  .audio-toolbar .at-warn { font-size: 12px; color: #b8860b; }
  .result { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
  .result a { display: inline-block; margin: 4px 8px 4px 0; padding: 6px 12px; background: #e9f6ec; color: #1f7a3d; border-radius: 6px; font-size: 13px; text-decoration: none; }
  .file-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
  .file-row:hover { background: var(--accent-bg); }
  .file-row .f-main { font-weight: 500; }
  .file-row .f-sub { color: var(--muted); font-size: 12px; }
  .dl-bar { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .dl-bar .check { margin-top: 0; }
  .error { margin-top: 14px; padding: 10px 14px; background: #fdecec; color: #c0392b; border-radius: 8px; font-size: 13px; }
  .check { font-size: 12px; color: var(--muted); margin-top: 10px; }
  /* ===== 自定义确认弹窗 ===== */
  .modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 999; opacity: 0; transition: opacity .18s; }
  .modal-mask.show { opacity: 1; }
  .modal { width: 380px; max-width: calc(100vw - 40px); background: var(--card); border-radius: 14px; box-shadow: 0 18px 50px rgba(15,23,42,.28); padding: 26px 26px 20px; transform: scale(.92); transition: transform .18s; user-select: text; }
  .modal-mask.show .modal { transform: scale(1); }
  .modal .m-icon { font-size: 34px; text-align: center; margin-bottom: 12px; }
  .modal .m-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 10px; }
  .modal .m-msg { font-size: 13px; color: var(--muted); line-height: 1.7; text-align: center; margin-bottom: 6px; white-space: pre-line; }
  .modal .m-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal .m-btn { flex: 1; padding: 9px 0; border-radius: 9px; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text); transition: all .15s; }
  .modal .m-btn:hover { background: var(--accent-bg); }
  .modal .m-btn.primary { background: #e74c3c; border-color: #e74c3c; color: #fff; }
  .modal .m-btn.primary:hover { background: #d63a2a; }
  /* ===== 执行进度弹窗 ===== */
  #progressMask .pg-bar, #loginMask .pg-bar { height: 12px; background: var(--border); border-radius: 99px; overflow: hidden; margin: 16px 0 8px; }
  #progressMask .pg-bar > div, #loginMask .pg-bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, #2f6fed, #6f9bf3); border-radius: 99px; transition: width .4s; }
  #progressMask .pg-meta, #loginMask .pg-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); }
  /* 进度消息固定单行：超出省略号截断，避免长日志把弹窗撑得来回伸缩 */
  #progressMask .pg-meta #pgMsg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #progressMask .pg-meta #pgPct { flex-shrink: 0; }
  /* ===== 设置页：依赖管理 ===== */
  .set-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding-right: 21px; }
  /* padding-right 21px = 卡片 border(1px) + padding(20px)：让「↻ 刷新」与下方卡片里
     一列卸载按钮的右缘对齐（卡片内按钮右缘 = 页面内容区右缘 - 21px） */
  .set-head h2 { font-size: 17px; margin-bottom: 4px; }
  .set-head .hint { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .dep-group { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .dep-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dep-head .d-name { font-size: 15px; font-weight: 600; }
  .dep-head .btn-uninstall-all { margin-left: auto; }
  .dep-badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .dep-badge.ok { background: #e9f6ec; color: #1f7a3d; }
  .dep-badge.miss { background: #fdecec; color: #c0392b; }
  .dep-desc { font-size: 12px; color: var(--muted); margin: 6px 0 4px; line-height: 1.6; }
  .dep-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; table-layout: fixed; }
  /* 首列固定比例宽：不同工具卡片的说明列（d-info）起点一致且靠近卡片中部 */
  .dep-table td.d-item { width: 36%; }
  .dep-table td { padding: 7px 8px; border-top: 1px solid var(--border); vertical-align: middle; overflow: hidden; text-overflow: ellipsis; }
  .dep-table tr:first-child td { border-top: none; }
  .dep-table td.d-info { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .dep-table td.d-op { text-align: right; white-space: nowrap; padding-right: 0; }
  .dep-table td.d-op .btn-mini + .btn-mini { margin-left: 6px; }
  .dep-actions { margin-top: 12px; }
  #viewSettings.busy .dep-table button, #viewSettings.busy .dep-actions button { opacity: .45; pointer-events: none; }
  .set-error { margin-bottom: 12px; padding: 10px 14px; background: #fdecec; color: #c0392b; border-radius: 8px; font-size: 13px; white-space: pre-line; }
  /* ===== 首页底部：API 接口入口 =====
     #viewHome 用 flex column + min-height 让卡片墙不论多少张都能贴顶显示，
     .home-footer 用 margin-top: auto 始终贴底，避免大片空白把按钮悬在中部 */
  #viewHome { display: flex; flex-direction: column; min-height: calc(100vh - 50px); }
  .home-footer { text-align: center; margin-top: auto; padding: 24px 0 6px; }
  /* ===== API 接口文档页 ===== */
  .api-sec { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .api-sec h3 { font-size: 15px; margin-bottom: 4px; }
  .api-sec .api-sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.6; }
  .api-base { font-family: Consolas, Menlo, monospace; font-size: 12px; background: var(--accent-bg); color: var(--accent); padding: 2px 8px; border-radius: 5px; }
  .api-endpoint { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; flex-wrap: wrap; }
  .api-endpoint:first-of-type { border-top: none; }
  .method { font-weight: 600; font-size: 11px; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; font-family: Consolas, Menlo, monospace; }
  .method.GET { background: #e9f6ec; color: #1f7a3d; }
  .method.POST { background: var(--accent-bg); color: var(--accent); }
  .method.DELETE { background: #fdecec; color: #c0392b; }
  .api-path { font-family: Consolas, Menlo, monospace; font-size: 12px; }
  .api-desc { color: var(--muted); font-size: 12px; }
  .api-code { position: relative; background: #f6f8fa; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 8px 0 4px; font-family: Consolas, Menlo, monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; cursor: pointer; }
  .api-code:hover { border-color: var(--accent); }
  .api-code .copy-tip { position: absolute; top: 6px; right: 8px; font-size: 11px; color: #1f7a3d; background: #e9f6ec; border-radius: 4px; padding: 1px 6px; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .api-code.copied .copy-tip { opacity: 1; }
  .api-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; table-layout: fixed; }
  .api-table th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .api-table td { padding: 5px 8px; border-top: 1px solid var(--border); vertical-align: top; word-break: break-all; }
  .api-table td:first-child { font-family: Consolas, Menlo, monospace; }
  .req { color: #c0392b; font-size: 11px; }
  .api-badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--accent-bg); color: var(--accent); margin-left: 8px; }
  @media (max-width: 760px) { .tool-layout { flex-direction: column; } .tool-side { width: 100%; } .dep-table td.d-item { width: 180px; } }
</style>
</head>
<body>
<div class="topbar">
  <span class="logo" id="logoHome" title="返回首页" style="cursor:pointer">🧰 office-toolbox</span>
  <span class="sub">个人办公工具箱 · 壳 + 插件，按需加载</span>
  <button class="btn-settings" id="btnSettings" title="依赖管理">⚙️ 设置</button>
  <button class="btn-back" id="btnBack">← 返回首页</button>
</div>

<div class="view" id="viewHome">
  <div class="grid" id="cardGrid"></div>
  <div class="home-footer">
    <button class="btn-mini" id="btnApiDoc" title="所有工具均可通过 HTTP API 调用">🔌 API 接口</button>
  </div>
</div>

<div class="view" id="viewTool" style="display:none">
  <div class="tool-layout">
    <div class="tool-side" id="actionList"></div>
    <div class="tool-main">
      <h2 id="actTitle"></h2>
      <div class="hint" id="actHint"></div>
      <div class="field">
        <label>选择文件</label>
        <div class="drop" id="dropZone">
          <div id="dropText">点击或拖拽文件到此处</div>
          <div class="file-list" id="fileList"></div>
        </div>
      </div>
      <div class="field" id="audioPreview" style="display:none">
        <label>🎧 音频预览（← → 方向键快进/快退 · 拖拽进度条 / 暂停到想切的位置，点下方按钮加入切分点）</label>
        <audio id="audioPlayer" controls preload="metadata"></audio>
        <div class="audio-toolbar">
          <span class="at-time" id="audioTime">--:-- / --:--</span>
          <button class="btn-mini" id="btnSkipBack">⏮ 后退 -1s</button>
          <button class="btn-mini" id="btnFwd">前进 +1s ⏭</button>
          <button class="btn-mini" id="btnMark">⏱ 取当前时间 → 加入切分点</button>
          <span class="at-tip" id="markTip"></span>
          <span class="at-warn" id="audioWarn" style="display:none"></span>
        </div>
      </div>
      <div id="paramFields"></div>
      <button class="btn" id="btnRun">开始转换</button>
      <div class="check" id="tipLine"></div>
      <div class="result" id="resultBox"></div>
    </div>
  </div>
</div>

<div class="view" id="viewSettings" style="display:none">
  <div class="set-head">
    <div>
      <h2>⚙️ 依赖管理</h2>
      <div class="hint">各插件的 Python 依赖与大组件（浏览器、AI 模型）安装状态。使用前先装，缺什么点什么；不再需要可卸载腾出空间。</div>
    </div>
    <button class="btn-mini" id="btnDepsRefresh">↻ 刷新</button>
  </div>
  <div id="settingsMsg"></div>
  <div id="depsList"></div>
</div>

<div class="view" id="viewApi" style="display:none">
  <div class="set-head">
    <div>
      <h2>🔌 API 接口文档</h2>
      <div class="hint">所有工具既能在网页里用，也能以 HTTP API 调用。文档由各插件的 manifest 自动生成，装了新插件刷新本页即可看到。</div>
    </div>
    <button class="btn-mini" id="btnApiRefresh">↻ 刷新</button>
  </div>
  <div id="apiDoc"></div>
</div>

<div class="modal-mask" id="progressMask" style="display:none">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="m-icon">⏳</div>
    <div class="m-title" id="pgTitle">正在处理…</div>
    <div class="pg-bar"><div id="pgBar"></div></div>
    <div class="pg-meta"><span id="pgMsg">准备中…</span><span id="pgPct"></span></div>
    <div class="check" style="margin-top:12px">任务正在后台执行，完成后此窗口自动关闭</div>
  </div>
</div>

<div class="modal-mask" id="loginMask" style="display:none">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="m-title" id="lgTitle">
      <span>扫码登录</span>
      <span onclick="closeLoginDialog()" style="cursor:pointer;font-size:22px;line-height:1;color:var(--muted);float:right;margin-left:16px" title="关闭">×</span>
    </div>
    <div style="display:flex; justify-content:center; margin: 14px 0 10px;">
      <div id="lgQrBox" style="min-width:220px;min-height:220px;width:100%;display:flex;align-items:center;justify-content:center;background:var(--accent-bg);border-radius:10px;color:var(--muted);font-size:13px;text-align:center;padding:8px;white-space:pre-wrap;word-break:break-all">生成二维码…</div>
    </div>
    <div id="lgProgress" style="display:none;padding:0 4px">
      <div class="pg-bar"><div id="lgBar"></div></div>
      <div class="pg-meta"><span id="lgProgMsg">准备中…</span><span id="lgPct"></span></div>
    </div>
    <div class="m-msg" id="lgStatus">准备中…</div>
    <div class="check" style="margin-top:10px">用对应 App 扫码并确认后，此窗口会自动完成登录并关闭</div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
// HTML 转义：所有进入 innerHTML 的动态文本（插件 manifest 文案、转换结果的
// 文件名等，后者常来自抖音/B站标题）都必须过这一层，防止 < > " 破坏页面结构
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let plugins = [], current = null, currentAction = null, selectedFiles = [];
// 已转换但尚未下载的结果文件（返回首页时若存在则提示并清理，对所有工具生效）
let pendingFiles = [];

async function load() {
  const res = await fetch('/api/plugins');
  const data = await res.json();
  plugins = data.plugins || [];
  renderCards();
}

function renderCards() {
  const grid = $('#cardGrid');
  if (!plugins.length) { grid.innerHTML = '<div class="empty">还没有安装任何插件。<br>把插件文件夹放进 plugins/ 目录后刷新即可。</div>'; return; }
  grid.innerHTML = plugins.map(p => `
    <div class="card" onclick="openPlugin('${esc(p.id)}')">
      <div class="name">${esc(p.icon || '🧰')} ${esc(p.name)} <span style="font-size:11px;color:var(--muted);font-weight:400">v${esc(p.version)}</span></div>
      <div class="desc">${esc(p.description)}</div>
      <span class="actions">${p.actions.length} 个子功能 · 按需加载</span>
    </div>`).join('');
}

function openPlugin(pid) {
  current = plugins.find(p => p.id === pid);
  if (!current) return;
  selectedFiles = []; currentAction = null;
  pendingFiles = [];  // 切换工具视为放弃之前的未下载结果（文件留待 TTL 自动清理）
  $('#viewHome').style.display = 'none';
  $('#viewTool').style.display = 'block';
  $('#btnBack').style.display = 'block';
  $('#resultBox').innerHTML = ''; $('#errorBox') && $('#errorBox').remove();
  if (!current.actions || !current.actions.length) {
    // manifest 没有声明任何子功能的插件：提示而不是在渲染时崩掉
    $('#actionList').innerHTML = '';
    $('#actTitle').textContent = current.name;
    $('#actHint').textContent = '该插件没有声明任何子功能，请检查其 manifest.json';
    $('#paramFields').innerHTML = '';
    return;
  }
  const list = $('#actionList');
  list.innerHTML = current.actions.map((a, i) => `
    <div class="t-item ${i === 0 ? 'active' : ''}" onclick="selectAction('${esc(a.id)}')">
      ${esc(a.name)}
      <div class="t-desc">${esc(a.description)}</div>
    </div>`).join('');
  selectAction(current.actions[0].id);
}

function selectAction(aid) {
  currentAction = current.actions.find(a => a.id === aid);
  selectedFiles = [];
  const items = document.querySelectorAll('#actionList .t-item');
  items.forEach(el => el.classList.remove('active'));
  const idx = current.actions.findIndex(a => a.id === aid);
  if (items[idx]) items[idx].classList.add('active');
  $('#actTitle').textContent = currentAction.name;
  $('#actHint').textContent = currentAction.description;
  $('#fileList').innerHTML = '';
  resetAudioPreview();
  const fileFieldEl = $('#dropZone').closest('.field');
  if (currentAction.input === 'text') {
    // 文本型动作：只需填写链接/参数，无需上传文件，隐藏文件选择区
    if (fileFieldEl) fileFieldEl.style.display = 'none';
    $('#dropText').textContent = '';
  } else {
    if (fileFieldEl) fileFieldEl.style.display = '';
    $('#dropText').textContent = currentAction.input === 'files' ? '点击或拖拽文件到此处（可多选，支持整个文件夹）' : '点击或拖拽文件到此处';
  }
  $('#resultBox').innerHTML = ''; $('#errorBox') && $('#errorBox').remove();
  const drop = $('#dropZone');
  drop.dataset.accept = (currentAction.accept || '').toLowerCase();
  renderParams();
}

function renderParamControl(p) {
  const id = `param_${p.name}`;
  if (p.type === 'select') {
    const opts = (p.options || []).map(o => {
      const val = (o && o.value !== undefined) ? o.value : o;
      const lbl = (o && o.label !== undefined) ? o.label : o;
      const sel = (String(val) === String(p.default || '')) ? ' selected' : '';
      return `<option value="${esc(val)}"${sel}>${esc(lbl)}</option>`;
    }).join('');
    return `<select id="${id}">${opts}</select>`;
  }
  return `<input type="${p.type === 'number' ? 'number' : 'text'}" id="${id}" placeholder="${esc(p.placeholder || '')}" value="${esc(p.default || '')}">`;
}

function renderParams() {
  const box = $('#paramFields');
  const params = currentAction.params || [];
  if (!params.length) { box.innerHTML = ''; $('#tipLine').textContent = ''; return; }
  const heading = '参数';
  box.innerHTML = `<div class="field"><label>${heading}</label></div>` + params.map(p => `
    <div class="field" data-param="${esc(p.name)}">
      <label>${esc(p.label)}${p.required ? ' <span style="color:#c0392b">*</span>' : ''}</label>
      ${renderParamControl(p)}
      ${p.hint ? `<div class="check">${esc(p.hint)}</div>` : ''}
    </div>`).join('');
  // 联动显隐：当某个 select 参数等于指定值时显示/隐藏本参数
  params.forEach(p => {
    if (!p.showWhen) return;
    const fieldEl = box.querySelector(`[data-param="${p.name}"]`);
    if (!fieldEl) return;
    Object.entries(p.showWhen).forEach(([triggerName, triggerValue]) => {
      const triggerEl = $(`#param_${triggerName}`);
      if (!triggerEl || triggerEl.tagName !== 'SELECT') return;
      const update = () => {
        fieldEl.style.display = (String(triggerEl.value) === String(triggerValue)) ? '' : 'none';
      };
      triggerEl.addEventListener('change', update);
      update();
    });
  });
  $('#tipLine').textContent = params.length ? '带 * 的为必填项' : '';
  syncSkipButtons();
  const skipEl = $('#param_skip');
  if (skipEl) skipEl.addEventListener('input', syncSkipButtons);
}

const drop = $('#dropZone');
drop.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file'; input.multiple = currentAction.input === 'files';
  if (currentAction.accept) input.accept = currentAction.accept;
  input.onchange = () => addFiles(input.files);
  input.click();
});
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', async e => {
  e.preventDefault(); drop.classList.remove('drag');
  // 拖入文件夹时 dataTransfer.files 拿不到内容，需走 webkitGetAsEntry 递归收集；
  // entries 必须在第一个 await 之前全部取出（DataTransferItem 仅在事件内有效）
  const entries = [];
  if (e.dataTransfer.items && e.dataTransfer.items.length && e.dataTransfer.items[0].webkitGetAsEntry) {
    for (const item of e.dataTransfer.items) {
      const en = item.webkitGetAsEntry();
      if (en) entries.push(en);
    }
  }
  if (entries.some(en => en.isDirectory)) {
    const collected = [];
    for (const en of entries) await walkEntry(en, collected);
    if (collected.length) { addFiles(collected); return; }
  }
  addFiles(e.dataTransfer.files);
});

// 递归遍历拖入的目录/文件。readEntries 每次最多返回 100 条，必须循环读到空为止
async function walkEntry(entry, out) {
  if (entry.isFile) {
    const f = await new Promise(res => entry.file(res, () => res(null)));
    if (f) out.push(f);
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    while (true) {
      const batch = await new Promise(res => reader.readEntries(res, () => res([])));
      if (!batch.length) break;
      for (const child of batch) await walkEntry(child, out);
    }
  }
}

function renderSelectedFiles() {
  $('#fileList').innerHTML = selectedFiles.map((f, i) =>
    `<div>📄 ${esc(f.name)}<span class="f-remove" data-i="${i}" title="移除该文件">✕ 删除</span></div>`).join('');
  $('#dropText').textContent = selectedFiles.length ? `已选 ${selectedFiles.length} 个文件，继续点击可添加` : '点击或拖拽文件到此处';
  updateAudioPreview();
}

// 点击 ✕ 移除单个已选文件（传错了不用整个重来）
$('#fileList').addEventListener('click', e => {
  const t = e.target.closest('.f-remove');
  if (!t) return;
  selectedFiles.splice(Number(t.dataset.i), 1);
  renderSelectedFiles();
});

function addFiles(files) {
  const accept = (currentAction.accept || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
  for (const f of files) {
    const ext = '.' + f.name.split('.').pop().toLowerCase();
    if (accept.length && !accept.includes(ext) && !accept.includes('.*')) {
      alert(`不支持的文件类型: ${f.name}（仅支持 ${currentAction.accept}）`);
      continue;
    }
    selectedFiles.push(f);
  }
  renderSelectedFiles();
}

/* ============ 音频预览（插件 manifest 的 action 声明 "preview": "audio" 时启用） ============ */
let audioObjectURL = null;

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
}

function resetAudioPreview() {
  const box = $('#audioPreview');
  if (audioObjectURL) { URL.revokeObjectURL(audioObjectURL); audioObjectURL = null; }
  const player = $('#audioPlayer');
  player.removeAttribute('src'); player.load();
  $('#audioTime').textContent = '--:-- / --:--';
  $('#markTip').textContent = '';
  $('#audioWarn').style.display = 'none';
  box.style.display = 'none';
}

function updateAudioPreview() {
  const player = $('#audioPlayer');
  const box = $('#audioPreview');
  resetAudioPreview();
  const previews = currentAction && currentAction.preview;
  if (!previews || !selectedFiles.length) return;
  audioObjectURL = URL.createObjectURL(selectedFiles[0]);
  player.src = audioObjectURL;
  box.style.display = '';
}

function markCurrentTime() {
  const player = $('#audioPlayer');
  if (!player.duration || !isFinite(player.duration)) {
    $('#markTip').textContent = '⏳ 音频还没加载好，稍等再试';
    return;
  }
  let t = Math.round(player.currentTime);
  const dur = Math.floor(player.duration);
  if (t >= dur) t = Math.max(0, dur - 1);
  const firstText = (currentAction.params || []).find(p => p.type === 'text');
  if (!firstText) { $('#markTip').textContent = '⚠ 该动作没有可填时间的参数'; return; }
  const el = $(`#param_${firstText.name}`);
  if (!el) return;
  const cur = el.value.trim();
  el.value = cur ? cur + ',' + fmtTime(t) : fmtTime(t);
  $('#markTip').textContent = `✅ 已加入 ${fmtTime(t)}`;
  setTimeout(() => { $('#markTip').textContent = ''; }, 2000);
}

$('#audioPlayer').addEventListener('timeupdate', () => {
  const p = $('#audioPlayer');
  if (p.duration && isFinite(p.duration)) {
    $('#audioTime').textContent = `${fmtTime(p.currentTime)} / ${fmtTime(p.duration)}`;
  }
});
$('#audioPlayer').addEventListener('error', () => {
  $('#audioWarn').textContent = '⚠ 该格式浏览器无法直接预览（不影响切分，可继续操作）';
  $('#audioWarn').style.display = '';
});
$('#btnMark').addEventListener('click', markCurrentTime);

/* 快进/快退：步长读取参数区的 skip 参数（约定参数名 skip，默认 1 秒） */
function getSkipStep() {
  const el = $('#param_skip');
  if (!el || !el.value) return 1;
  const n = parseFloat(el.value);
  return (isFinite(n) && n > 0) ? n : 1;
}

function skipAudio(dir) {
  const player = $('#audioPlayer');
  if (!player.duration || !isFinite(player.duration)) {
    $('#markTip').textContent = '⏳ 音频还没加载好，稍等再试';
    return;
  }
  const step = getSkipStep();
  const target = Math.min(Math.max(player.currentTime + dir * step, 0), player.duration);
  player.currentTime = target;
}

function syncSkipButtons() {
  const n = getSkipStep();
  const back = $('#btnSkipBack'), fwd = $('#btnFwd');
  if (back) back.textContent = `⏮ 后退 -${n}s`;
  if (fwd) fwd.textContent = `前进 +${n}s ⏭`;
}

$('#btnSkipBack').addEventListener('click', () => skipAudio(-1));
$('#btnFwd').addEventListener('click', () => skipAudio(1));

/* 键盘 ← → 快进/快退：仅音频预览可用时生效；焦点在输入框时不拦截（避免影响移动光标/打字）
   用捕获阶段（第三个参数 true）：点击播放器内部控件后焦点在 Shadow DOM 里，
   浏览器会把方向键当作媒体控制拦截，捕获阶段可在其之前先收到按键。 */
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const box = $('#audioPreview');
  if (!box || box.style.display === 'none') return;
  const player = $('#audioPlayer');
  if (!player || !player.src) return;
  e.preventDefault(); // 阻止浏览器对焦点内媒体控件的默认方向键行为
  e.stopPropagation(); // 阻止事件继续传到播放器内部控件（避免原生媒体控制再执行一次 seek）
  skipAudio(e.key === 'ArrowLeft' ? -1 : 1);
}, true);

/* ============ 执行进度弹窗（任务标识 + 轮询 /api/progress/{task_id}） ============ */
let progressTimer = null, progressShowTimer = null;

function startProgress(taskId) {
  stopProgress();
  $('#pgBar').style.width = '0%';
  $('#pgPct').textContent = '';
  $('#pgMsg').textContent = '准备中…';
  // 700ms 内结束的快速任务不弹窗，避免闪烁
  const mask = $('#progressMask');
  progressShowTimer = setTimeout(() => {
    mask.style.display = 'flex';
    requestAnimationFrame(() => mask.classList.add('show'));
  }, 700);
  progressTimer = setInterval(async () => {
    try {
      const res = await fetch(`/api/progress/${taskId}`);
      const data = await res.json();
      if (data.progress) {
        if (data.progress.percent != null) {
          $('#pgBar').style.width = data.progress.percent + '%';
          $('#pgPct').textContent = data.progress.percent + '%';
        }
        if (data.progress.message) $('#pgMsg').textContent = data.progress.message;
      }
    } catch (e) { /* 网络抖动忽略，下个周期重试 */ }
  }, 600);
}

function stopProgress() {
  if (progressShowTimer) { clearTimeout(progressShowTimer); progressShowTimer = null; }
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  const mask = $('#progressMask');
  mask.classList.remove('show');
  setTimeout(() => { mask.style.display = 'none'; }, 180);
}

/* ============ 扫码登录弹窗（manifest 动作声明 ui:"login" 时启用） ============
 * 壳契约：POST /api/login/{pid}/start 返回 {image: dataURL}，
 * GET /api/login/{pid}/poll 返回 {status: waiting/scanned/confirmed/expired/refresh/error, message}
 *   - refresh：后端检测到二维码临近过期且仍无人扫码，要求前端重新生成（与 expired 行为一致）；
 *             已扫码状态不会返回 refresh，避免打断用户确认。 */
let loginPollTimer = null, loginProgressTimer = null;

function openLoginDialog() {
  closeLoginDialog(true);   // 防止重复打开
  const pid = current.id;
  const mask = $('#loginMask');
  const qrBox = mask.querySelector('#lgQrBox');
  const statusEl = mask.querySelector('#lgStatus');
  const setStatus = t => { statusEl.textContent = t; };
  const reset = () => { qrBox.innerHTML = '生成二维码…'; qrBox.style.color = 'var(--muted)'; setStatus('准备中…'); };

  // 登录准备进度（首次扫码需下载浏览器组件等）：start 请求阻塞期间轮询展示
  const showProgress = p => {
    const box = mask.querySelector('#lgProgress');
    if (!p || !p.active) { box.style.display = 'none'; return; }
    box.style.display = '';
    if (p.percent != null) {
      mask.querySelector('#lgBar').style.width = p.percent + '%';
      mask.querySelector('#lgPct').textContent = p.percent + '%';
    }
    if (p.message) mask.querySelector('#lgProgMsg').textContent = p.message;
  };
  const stopProgressPoll = () => {
    if (loginProgressTimer) { clearInterval(loginProgressTimer); loginProgressTimer = null; }
    showProgress(null);
  };
  loginProgressTimer = setInterval(async () => {
    try {
      const res = await fetch(`/api/login/${pid}/progress`);
      const d = await res.json();
      showProgress(d.progress);
    } catch (e) { /* 网络抖动忽略，下个周期重试 */ }
  }, 700);

  mask.style.display = 'flex';
  requestAnimationFrame(() => mask.classList.add('show'));

  const start = async () => {
    reset();
    try {
      const res = await fetch(`/api/login/${pid}/start`, { method: 'POST' });
      const d = await res.json();
      stopProgressPoll();
      if (!d.success || !d.image) { setStatus('❌ ' + (d.message || '生成二维码失败')); return false; }
      qrBox.innerHTML = `<img src="${d.image}" style="width:200px;height:200px;image-rendering:pixelated" alt="二维码">`;
      setStatus('请用 App 扫码');
      loginPollTimer = setInterval(poll, 1500);
      return true;
    } catch (e) { stopProgressPoll(); setStatus('❌ 请求失败: ' + e.message); return false; }
  };

  const poll = async () => {
    try {
      const res = await fetch(`/api/login/${pid}/poll`);
      const d = await res.json();
      if (d.status === 'scanned') { setStatus('✅ 已扫码，请在手机上确认…'); return; }
      if (d.status === 'confirmed') {
        setStatus('🎉 ' + (d.message || '登录成功'));
        clearInterval(loginPollTimer); loginPollTimer = null;
        setTimeout(closeLoginDialog, 1600);
        return;
      }
      if (d.status === 'expired' || d.status === 'refresh') {
        setStatus(d.status === 'expired' ? '二维码已过期，正在刷新…' : '二维码即将过期，自动刷新中…');
        stopPoll(); start(); return;
      }
      if (d.status === 'error') { setStatus('❌ ' + (d.message || '查询失败')); stopPoll(); }
    } catch (e) { /* 网络抖动忽略，下个周期重试 */ }
  };
  const stopPoll = () => { if (loginPollTimer) { clearInterval(loginPollTimer); loginPollTimer = null; } };

  // 只有点右上角 × 才关闭（closeLoginDialog 会停掉轮询定时器）：
  // 遮罩点击不关闭，防止用户选中二维码/文字时误触
  start();
}

function closeLoginDialog(instant = false) {
  if (loginPollTimer) { clearInterval(loginPollTimer); loginPollTimer = null; }
  if (loginProgressTimer) { clearInterval(loginProgressTimer); loginProgressTimer = null; }
  const mask = $('#loginMask');
  if (instant) { mask.style.display = 'none'; mask.classList.remove('show'); return; }
  mask.classList.remove('show');
  setTimeout(() => { mask.style.display = 'none'; }, 180);
}

$('#btnRun').addEventListener('click', async () => {
  const btn = $('#btnRun');
  // 扫码登录类动作：不走通用执行流程，打开登录弹窗（二维码展示 + 自动轮询）
  if (currentAction.ui === 'login') { openLoginDialog(); return; }
  if (currentAction.input !== 'text' && !selectedFiles.length) { alert('请先选择文件'); return; }
  for (const p of (currentAction.params || [])) {
    if (p.required) {
      const el = $(`#param_${p.name}`);
      if (!el || !el.value.trim()) { alert(`请填写必填项：${p.label}`); return; }
    }
  }
  btn.disabled = true; btn.textContent = '处理中…';
  $('#resultBox').innerHTML = ''; $('#errorBox') && $('#errorBox').remove();
  const fd = new FormData();
  selectedFiles.forEach(f => fd.append('files', f));
  const params = {};
  (currentAction.params || []).forEach(p => {
    const v = $(`#param_${p.name}`).value.trim();
    if (v !== '') params[p.name] = p.type === 'number' ? Number(v) : v;
  });
  fd.append('params', JSON.stringify(params));
  // 任务标识：执行期间前端凭它轮询进度
  const taskId = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}${Math.random()}`)
    .replace(/[^0-9a-f]/g, '').padEnd(16, '0').slice(0, 16);
  fd.append('task_id', taskId);
  startProgress(taskId);
  try {
    const res = await fetch(`/api/plugins/${current.id}/run/${currentAction.id}`, { method: 'POST', body: fd });
    const data = await res.json();
    if (!data.success) { showError(data.error || '转换失败'); return; }
    renderResults(data);
  } catch (e) {
    showError('请求失败: ' + e.message);
  } finally {
    stopProgress();
    btn.disabled = false; btn.textContent = '开始转换';
  }
});

/* ============ 结果渲染：多文件时可勾选下载（通用能力，插件返回 start/end 时展示片段区间） ============ */
// 下载阈值：超过它改用 <a download> 直链让浏览器流式下载，避免 fetch+blob 把
// 整个大文件（GB 级视频）吃进内存。直链文件由服务端「响应发完即焚」负责删除，
// 前端不再对其发 DELETE（见 downloadFiles 返回值说明）。
const DIRECT_DL_THRESHOLD = 200 * 1024 * 1024;

async function downloadFiles(list) {
  // 返回走直链下载的文件列表。这些文件的下载在 a.click() 后仍由浏览器
  // 传输中，调用方清理服务端文件时应跳过它们：
  //   - 小文件（blob）：fetch 完整取回后才返回，立即 DELETE 安全；
  //   - 直链大文件：服务端 GET 路由在响应流结束后自动焚毁（下载即焚），
  //     若前端此时发 DELETE，轻则撞上传输中的文件（Windows 删除失败静默
  //     残留，只能靠 TTL 兜底），重则赶在服务端打开文件前删掉导致下载 404。
  const direct = [];
  for (const f of list) {
    try {
      if ((f.size || 0) > DIRECT_DL_THRESHOLD) {
        const a = document.createElement('a');
        a.href = f.url; a.download = f.name;
        document.body.appendChild(a); a.click(); a.remove();
        direct.push(f);
        continue;
      }
      const resp = await fetch(f.url);
      if (!resp.ok) {  // 404 等错误响应的 JSON body 不能存成文件（否则出现打不开的"坏图片"）
        console.error('下载失败(HTTP ' + resp.status + '):', f.name);
        continue;
      }
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      // 延迟释放 blob 地址：点击瞬间就 revoke 会让浏览器下载中断（表现为"失败-未发现文件"）
      setTimeout(() => URL.revokeObjectURL(url), 30_000);
    } catch (e) { console.error('下载失败:', f.name, e); }
  }
  return direct;
}

/* 清理本次任务的全部结果文件（下载选中的被"下载即焚"，未选中的在这里一并删除，不再等待 TTL） */
async function cleanupTaskFiles(files) {
  for (const f of files) {
    try { await fetch(f.url, { method: 'DELETE' }); } catch (e) { /* 已焚毁的文件返回 404，忽略 */ }
  }
}

function renderResults(data) {
  const files = data.files || [];
  pendingFiles = files;  // 记录本次未下载的转换结果，供返回首页时提示清理
  if (files.length === 1) {
    const f = files[0];
    $('#resultBox').innerHTML = `
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">✅ 转换完成：</div>
      <a href="${esc(f.url)}" download>⬇ ${esc(f.name)}</a>`;
    // 单文件：点击下载（下载即焚）后视为已处理，返回首页不再提示
    $('#resultBox a').addEventListener('click', () => { pendingFiles = []; });
    return;
  }
  const rows = files.map((f, i) => {
    const hasRange = (f.start !== undefined && f.end !== undefined);
    const range = hasRange ? `${fmtTime(f.start)} - ${fmtTime(f.end)}` : '';
    const isImage = /\.(png|jpe?g|webp|gif|bmp|tiff?)$/i.test(f.name) || f.kind === 'cover';
    if (isImage) {
      // 图片：明确标注，不内联预览（/downloads 路由下载即焚，内联 <img> 会误删）。
      // kind=cover 是电子书封面；其余图片（如抖音图文）按图片计数展示，不冒称封面
      const label = f.kind === 'cover' ? '🖼 封面' : '🖼 图片';
      return `
        <label class="file-row">
          <input type="checkbox" class="dl-check" data-url="${esc(f.url)}" data-name="${esc(f.name)}">
          <span class="f-main">${label}</span>
          <span class="f-sub">${esc(f.name)}</span>
        </label>`;
    }
    const main = f.kind === 'md' ? '📄 正文'
               : (hasRange ? `第 ${i + 1} 段${range ? ` · ${range}` : ''}` : `第 ${i + 1} 项`);
    return `
      <label class="file-row">
        <input type="checkbox" class="dl-check" data-url="${esc(f.url)}" data-name="${esc(f.name)}">
        <span class="f-main">${main}</span>
        <span class="f-sub">${esc(f.name)}</span>
      </label>`;
  }).join('');
  $('#resultBox').innerHTML = `
    <div style="font-size:13px;font-weight:600;margin-bottom:8px">✅ 转换完成，共 ${files.length} 个文件，勾选要下载的：</div>
    ${rows}
    <div class="dl-bar">
      <label style="font-size:13px;cursor:pointer"><input type="checkbox" id="checkAll"> 全选</label>
      <button class="btn-mini" id="btnDlSel">下载选中 (0)</button>
      <span class="check">下载后本次任务的文件将全部自动清理</span>
    </div>`;
  const checks = [...document.querySelectorAll('.dl-check')];
  const updateCount = () => {
    const n = checks.filter(c => c.checked).length;
    const btn = $('#btnDlSel');
    if (btn) btn.textContent = `下载选中 (${n})`;
  };
  checks.forEach(c => c.addEventListener('change', updateCount));
  const checkAll = $('#checkAll');
  if (checkAll) checkAll.addEventListener('change', e => {
    checks.forEach(c => { c.checked = e.target.checked; });
    updateCount();
  });
    const btn = $('#btnDlSel');
  if (btn) btn.addEventListener('click', async () => {
    const sel = checks.filter(c => c.checked).map(c => ({ url: c.dataset.url, name: c.dataset.name }));
    if (!sel.length) return;
    btn.disabled = true; btn.textContent = '下载中…';
    const direct = await downloadFiles(sel);
    // 直链大文件由服务端响应结束后自动焚毁，前端只清理其余文件
    //（已取走的小文件 + 未勾选的一切）
    const directUrls = new Set(direct.map(f => f.url));
    await cleanupTaskFiles(files.filter(f => !directUrls.has(f.url)));
    pendingFiles = [];  // 已下载并清理，返回首页时不再提示
    btn.disabled = false; btn.textContent = '✅ 已下载并清理';
    checks.forEach(c => { c.checked = false; });
  });
}

/* ===== 自定义确认弹窗（Promise 封装，替代原生 confirm） =====
 * options: { icon, title, message, okText, okClass }
 * resolve(true) = 点击确认；resolve(false) = 点击取消/遮罩/Esc */
function showConfirm({ icon = '⚠️', title = '提示', message = '', okText = '确定', okClass = 'primary' } = {}) {
  return new Promise(resolve => {
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <div class="m-icon">${esc(icon)}</div>
        <div class="m-title">${esc(title)}</div>
        <div class="m-msg">${esc(message).replace(/\n/g, '\n')}</div>
        <div class="m-actions">
          <button class="m-btn" id="mCancel">取消</button>
          <button class="m-btn ${okClass}" id="mOk">${esc(okText)}</button>
        </div>
      </div>`;
    document.body.appendChild(mask);
    requestAnimationFrame(() => mask.classList.add('show'));
    const onKey = e => { if (e.key === 'Escape') done(false); };
    const done = val => {
      document.removeEventListener('keydown', onKey);  // 不留悬挂监听器
      mask.classList.remove('show');
      setTimeout(() => mask.remove(), 180);
      resolve(val);
    };
    mask.addEventListener('click', e => { if (e.target === mask) done(false); });
    mask.querySelector('#mCancel').addEventListener('click', () => done(false));
    mask.querySelector('#mOk').addEventListener('click', () => done(true));
    document.addEventListener('keydown', onKey);
    // 聚焦确认按钮，回车可确认
    setTimeout(() => mask.querySelector('#mOk').focus(), 60);
    mask.querySelector('#mOk').addEventListener('keydown', e => { if (e.key === 'Enter') { e.stopPropagation(); } });
  });
}

function goHome() {
  // 设置页 / API 文档页可能正开着，先复位其状态
  settingsOpen = false;
  $('#viewSettings').style.display = 'none';
  $('#btnSettings').classList.remove('active');
  apiOpen = false;
  $('#viewApi').style.display = 'none';
  // 有未下载的转换结果：先提示，确认后删除本次任务全部文件再返回（对所有工具统一生效）
  if (pendingFiles.length) {
    const n = pendingFiles.length;
    const doHome = () => {
      $('#viewTool').style.display = 'none';
      $('#viewHome').style.display = 'block';
      $('#btnBack').style.display = 'none';
      renderCards();
    };
    showConfirm({
      icon: '🗑️',
      title: '尚未下载转换结果',
      message: `有 ${n} 个转换结果尚未下载。\n返回首页将删除这些文件，确定要返回吗？`,
      okText: '删除并返回',

    }).then(ok => {

}

/* ============ API 接口文档页（由 /api/plugins 的 manifest 自动生成） ============
 * 壳的执行/进度/下载/登录/依赖接口本身就是 API；本页只负责把它们和各插件
 * 动作的参数声明、curl 示例组织成可读文档，与卡片墙共用同一份数据源——
 * 装了新插件刷新即见，无需维护第二份文档。 */
let apiOpen = false;

const PARAM_TYPE_TEXT = { text: '文本', number: '数字', select: '下拉' };

function apiInputDesc(action) {
  if (action.input === 'text') return '无需上传文件，参数中传文本（如链接）';
  if (action.input === 'file') return `上传单个文件（${action.accept || '任意类型'}）`;
  if (action.input === 'files') return `上传多个文件（${action.accept || '任意类型'}）`;
  return action.input || '无';
}

function apiParamSample(p) {
  if (p.type === 'number') {
    const n = Number(p.default);
    return (p.default !== undefined && p.default !== '' && isFinite(n)) ? n : 0;
  }
  if (p.default !== undefined && p.default !== '') return p.default;
  if (p.type === 'select') {
    const first = (p.options || [])[0];
    return first ? String(first.value !== undefined ? first.value : first) : '...';
  }
  return '...';
}

function curlSample(pid, action) {
  const lines = [`curl -X POST "${location.origin}/api/plugins/${pid}/run/${action.id}"`];
  if (action.input === 'file' || action.input === 'files') {
    const ext = ((action.accept || '').split(',')[0] || '.bin').replace('.', '');
    lines.push(`  -F "files=@示例文件.${ext}"`);
    if (action.input === 'files') lines.push(`  -F "files=@示例文件2.${ext}"`);
  }
  const required = (action.params || []).filter(p => p.required);
  if (required.length) {
    const obj = {};
    for (const p of required) obj[p.name] = apiParamSample(p);
    lines.push(`  -F 'params=${JSON.stringify(obj)}'`);
  }
  return lines.join(' \\\n');
}

    ${row('POST', '/api/setup/*', '依赖的安装 / 卸载（pip-install、pip-uninstall、asset-install、asset-uninstall、uninstall-all）')}

  // —— 执行动作详解 ——
  html += `<div class="api-sec">
    <h3>执行动作：POST /api/plugins/{pid}/run/{aid}</h3>
    <div class="api-sub">multipart/form-data 编码，三个字段均可按需省略：</div>
    <table class="api-table">

      <tr><td>params</td><td>JSON 字符串</td><td>动作参数，键名见各动作的参数表；可整体省略（全部取默认值）</td></tr>
      <tr><td>task_id</td><td>文本，可选</td><td>8~32 位十六进制任务标识；不传则服务端自动生成（此时无法轮询进度）</td></tr>
    </table>
    <div class="api-sub" style="margin-top:10px">响应示例（files 数组每项含 name / url / size 及动作附加信息如 start、end、kind）：</div>
    <div class="api-code">{

curl -OJ "${esc(base)}/downloads/{name}"<span class="copy-tip">已复制</span></div>

curl "${esc(base)}/api/login/${esc(p.id)}/poll"<span class="copy-tip">已复制</span></div>` : '';

/* ============ 设置页：依赖管理（/api/deps + /api/setup/*） ============
 * 数据由后端 deps.py 汇总（只读，不加载插件代码）；
 * 安装/卸载走 /api/setup/*，后台线程执行，进度复用 /api/progress/{op_id} 轮询。 */
let settingsOpen = false, settingsReturnView = 'home', setupBusy = false, setupTimer = null;
let depsCache = [];

const PKG_STATE_TEXT = { ok: '✓ 就绪', missing: '缺失', outdated: '版本不符' };
const ASSET_STATE_TEXT = { ok: '✓ 已安装', partial: '部分安装', missing: '未安装' };

function fmtSize(n) {
  if (!n) return '';
  if (n >= 1024 ** 3) return (n / 1024 ** 3).toFixed(2) + 'GB';
  return (n / 1024 ** 2).toFixed(1) + 'MB';
}

async function openSettings() {
  if (settingsOpen) { closeSettings(); return; }
  // 以 viewApi 实际显示状态为准（DOM 是唯一真相源，apiOpen 仅用于按钮 toggle 判定）
  const apiWasOpen = $('#viewApi').style.display !== 'none';
  // 记录「从哪个视图进入设置」，关闭时回到原视图（viewTool / viewApi 优先于 home）
  settingsReturnView = ($('#viewTool').style.display !== 'none' && current) ? 'tool'
                     : apiWasOpen ? 'api'
                     : 'home';
  // API 文档页打开时点设置：先关掉 viewApi，否则两个视图同时显示造成内容叠加
  // （viewApi 在 viewSettings 之后的兄弟节点，会盖在设置页上方）
  if (apiWasOpen) { apiOpen = false; $('#viewApi').style.display = 'none'; }
  settingsOpen = true;
  $('#viewHome').style.display = 'none';
  $('#viewTool').style.display = 'none';
  $('#viewSettings').style.display = 'block';
  $('#btnSettings').classList.add('active');
  loadSettings();
}

function closeSettings() {
  settingsOpen = false;
  $('#viewSettings').style.display = 'none';
  $('#btnSettings').classList.remove('active');
  if (settingsReturnView === 'tool' && current) $('#viewTool').style.display = 'block';
  // 同步 apiOpen 与 viewApi 的显示，否则下次点 API 文档按钮的 toggle 会失效
  else if (settingsReturnView === 'api') { apiOpen = true; $('#viewApi').style.display = 'block'; }
  else $('#viewHome').style.display = 'block';
}

async function loadSettings() {
  const list = $('#depsList');
  list.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const res = await fetch('/api/deps');
    const data = await res.json();
    renderDeps(data.plugins || []);
  } catch (e) {
    list.innerHTML = `<div class="set-error">加载依赖状态失败：${e.message}</div>`;
  }
}

function renderDeps(groups) {
  depsCache = groups;
  const list = $('#depsList');
  if (!groups.length) { list.innerHTML = '<div class="empty">没有可展示的插件</div>'; return; }
  list.innerHTML = groups.map(g => {
    // 可选组依赖（requirements-*.txt，如转写用的重依赖）不计入「未就绪」：
    // 缺着只影响个别动作，不该让整个插件看起来像坏的
    const badPkgs = (g.packages || []).filter(p => p.state !== 'ok' && !p.optional);
    const badge = badPkgs.length
      ? `<span class="dep-badge miss">${badPkgs.length} 个依赖未就绪</span>`
      : '<span class="dep-badge ok">依赖就绪</span>';
    const pkgRows = (g.packages || []).map(p => {
      const stateCls = p.state === 'ok' ? 'ok' : 'miss';
      const info = p.state === 'ok' ? `已装 ${p.installed}`
                 : p.state === 'missing' ? (p.spec ? `未安装（要求 ${p.spec}）` : '未安装')
                 : `已装 ${p.installed}，要求 ${p.spec}`;
      const ops = [];
      if (p.state !== 'ok') ops.push(`<button class="btn-mini" onclick="installPkg('${g.id}','${esc(p.name)}')">${p.state === 'outdated' ? '升级' : '安装'}</button>`);
      if (p.state !== 'missing') ops.push(`<button class="btn-mini danger" onclick="uninstallPkg('${g.id}','${esc(p.name)}')">卸载</button>`);
      return `<tr>
        <td class="d-item">${esc(p.name)}${p.optional ? ' <span style="color:var(--muted);font-size:11px">（可选）</span>' : ''} <span class="dep-badge ${stateCls}">${PKG_STATE_TEXT[p.state] || p.state}</span></td>
        <td class="d-info">${info}</td>
        <td class="d-op">${ops.join('')}</td>
      </tr>`;
    }).join('');
    const assetRows = (g.assets || []).map(a => {
      const stateCls = a.state === 'ok' ? 'ok' : 'miss';
      // 已装显示实际占用（不加「约」），未装显示预估体积（hint 已归一化，统一加「约」）
      const hasSize = (a.state === 'ok' || a.state === 'partial') && a.size;
      const sizeText = hasSize ? fmtSize(a.size) : (a.size_hint || '');
      const sizeLabel = sizeText ? (hasSize ? sizeText : '约 ' + sizeText) : '';
      const typeLabel = a.type === 'playwright' ? '浏览器组件' : a.type === 'modelscope' ? 'AI 模型' : (a.type || '组件');
      const ops = [];
      if (a.state !== 'ok') ops.push(`<button class="btn-mini" onclick="installAsset('${g.id}','${esc(a.id)}')">${a.state === 'partial' ? '续装' : '安装'}</button>`);
      if (a.state !== 'missing') ops.push(`<button class="btn-mini danger" onclick="uninstallAsset('${g.id}','${esc(a.id)}')">卸载</button>`);
      return `<tr>
        <td class="d-item">${esc(a.name || a.id)} <span class="dep-badge ${stateCls}">${ASSET_STATE_TEXT[a.state] || a.state}</span></td>
        <td class="d-info">${[typeLabel, a.description, sizeLabel].filter(Boolean).map(esc).join(' · ')}</td>
        <td class="d-op">${ops.join('')}</td>
      </tr>`;
    }).join('');
    const groupOp = badPkgs.length
      ? `<div class="dep-actions"><button class="btn-mini" onclick="installAllPkgs('${g.id}')">⬇ 一键安装缺失依赖（${badPkgs.length}）</button></div>`
      : '';
    // 一键卸载：有任一已装的 pip 包或大组件时才提供
    const installedPkgs = (g.packages || []).filter(p => p.state !== 'missing' && p.installed);
    const installedAssets = (g.assets || []).filter(a => a.state !== 'missing');
    const headUninstall = (installedPkgs.length + installedAssets.length)
      ? `<button class="btn-mini danger btn-uninstall-all" onclick="uninstallAll('${g.id}')">🗑️ 一键卸载</button>`
      : '';
    return `<div class="dep-group">
      <div class="dep-head"><span>${esc(g.icon || '🧰')}</span><span class="d-name">${esc(g.name)}</span>${badge}${headUninstall}</div>
      ${g.description ? `<div class="dep-desc">${esc(g.description)}</div>` : ''}
      ${(pkgRows || assetRows) ? `<table class="dep-table">${pkgRows}${assetRows}</table>` : '<div class="dep-desc">无外部依赖</div>'}
      ${groupOp}
    </div>`;
  }).join('');
}

function showSettingsError(msg) {
  $('#settingsMsg').innerHTML = msg ? `<div class="set-error">❌ ${msg.replace(/</g, '&lt;')}</div>` : '';
}

function setSettingsBusy(b) { $('#viewSettings').classList.toggle('busy', b); }

async function runSetup(url, body, title) {
  if (setupBusy) { alert('已有安装/卸载操作进行中，请等它完成'); return; }
  setupBusy = true; setSettingsBusy(true);
  showSettingsError('');
  let d;
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    d = await res.json();
  } catch (e) {
    alert('请求失败: ' + e.message); setupBusy = false; setSettingsBusy(false); return;
  }
  if (!d.success) { alert(d.error || '操作启动失败'); setupBusy = false; setSettingsBusy(false); return; }
  // 复用执行进度弹窗展示安装/卸载进度
  $('#pgTitle').textContent = title;
  $('#pgBar').style.width = '0%'; $('#pgPct').textContent = ''; $('#pgMsg').textContent = '准备中…';
  const mask = $('#progressMask');
  mask.style.display = 'flex';
  requestAnimationFrame(() => mask.classList.add('show'));
  let nullPolls = 0;  // 连续拿不到进度条目的次数（见轮询里的兜底）
  setupTimer = setInterval(async () => {
    try {
      const r = await fetch(`/api/progress/${d.op_id}`);
      const data = await r.json();
      const p = data.progress;
      if (!p) {
        // 进度条目不存在：要么操作已结束被覆盖清理（短暂窗口），要么服务重启丢失。
        // 连续多次拿不到就按失败收场，避免弹窗与 setupBusy 永久卡死
        nullPolls++;
        if (nullPolls >= 10) {
          clearInterval(setupTimer); setupTimer = null;
          mask.classList.remove('show');
          setTimeout(() => { mask.style.display = 'none'; }, 180);
          setupBusy = false; setSettingsBusy(false);
          showSettingsError('操作进度丢失（服务可能已重启），请刷新页面后重试');
        }
        return;
      }
      nullPolls = 0;
      if (p.percent != null) { $('#pgBar').style.width = p.percent + '%'; $('#pgPct').textContent = p.percent + '%'; }
      if (p.message) $('#pgMsg').textContent = p.message;
      if (p.done) {
        clearInterval(setupTimer); setupTimer = null;
        setTimeout(() => {
          mask.classList.remove('show');
          setTimeout(() => { mask.style.display = 'none'; }, 180);
          setupBusy = false; setSettingsBusy(false);
          if (p.error) showSettingsError('操作失败：' + p.error);
          loadSettings();   // 成功失败都刷新状态
        }, 500);
      }
    } catch (e) { /* 网络抖动忽略，下个周期重试 */ }
  }, 600);
}

function findAssetName(pid, assetId) {
  for (const g of depsCache) {
    if (g.id !== pid) continue;
    const a = (g.assets || []).find(x => x.id === assetId);
    if (a) return a.name || assetId;
  }
  return assetId;
}

async function installPkg(pid, name) {
  await runSetup('/api/setup/pip-install', { pid, names: [name] }, `安装 ${name}`);
}

async function installAllPkgs(pid) {
  await runSetup('/api/setup/pip-install', { pid }, '安装缺失依赖');
}

async function uninstallPkg(pid, name) {
  const ok = await showConfirm({
    icon: '🗑️', title: '卸载 Python 包',
    message: `确定卸载 ${name} 吗？\n其他插件若也依赖它将受影响（下次使用时会自动重装）。`,
    okText: '卸载',
  });
  if (ok) await runSetup('/api/setup/pip-uninstall', { pid, names: [name] }, `卸载 ${name}`);
}

async function installAsset(pid, assetId) {
  await runSetup('/api/setup/asset-install', { pid, asset_id: assetId }, `下载 ${findAssetName(pid, assetId)}`);
}

async function uninstallAsset(pid, assetId) {
  const name = findAssetName(pid, assetId);
  const ok = await showConfirm({
    icon: '🗑️', title: '移除组件',
    message: `确定移除 ${name} 吗？\n将释放对应磁盘空间，下次使用需重新下载。`,
    okText: '移除',
  });
  if (ok) await runSetup('/api/setup/asset-uninstall', { pid, asset_id: assetId }, `移除 ${name}`);
}

async function uninstallAll(pid) {
  const g = depsCache.find(x => x.id === pid);
  if (!g) return;
  const pkgs = (g.packages || []).filter(p => p.state !== 'missing' && p.installed);
  const assets = (g.assets || []).filter(a => a.state !== 'missing');
  const lines = [];
  if (pkgs.length) lines.push(`Python 包 ${pkgs.length} 个：${pkgs.map(p => p.name).join('、')}`);
  if (assets.length) lines.push(`大组件 ${assets.length} 个：${assets.map(a => a.name || a.id).join('、')}`);
  const ok = await showConfirm({
    icon: '🗑️', title: `一键卸载 ${g.name}`,
    message: `将卸载该工具已安装的全部依赖：\n${lines.join('\n')}\n\n其他工具共用这些依赖时也会受影响（下次使用时会自动重装）。`,
    okText: '全部卸载',
  });
  if (ok) await runSetup('/api/setup/uninstall-all', { pid }, `一键卸载 ${g.name}`);
}

$('#btnSettings').addEventListener('click', openSettings);
$('#btnDepsRefresh').addEventListener('click', loadSettings);

load();
</script>

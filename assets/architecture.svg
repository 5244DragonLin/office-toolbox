<svg viewBox="0 0 680 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>office-toolbox 架构示意</title>
<desc>浏览器入口连接轻量壳，壳管理可按需安装的插件，插件按需调用转换脚本</desc>
<rect x="270" y="20" width="140" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="40" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#0C447C">浏览器 · 你的入口</text>
<line x1="340" y1="60" x2="340" y2="90" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="100" y="94" width="480" height="110" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="124" y="114" font-family="sans-serif" font-size="13" fill="#0C447C">壳 · 永远很小（启动器 + 卡片首页 + 插件注册表）</text>
<rect x="120" y="128" width="130" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#042C53">FastAPI 服务</text>
<rect x="275" y="128" width="130" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#042C53">卡片首页</text>
<rect x="430" y="128" width="130" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="495" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#042C53">插件注册表</text>
<line x1="340" y1="204" x2="340" y2="236" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="100" y="240" width="230" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="215" y="262" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#04342C">电子书插件</text>
<text x="215" y="282" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">TXT→MD · MD→EPUB · EPUB→MD</text>
<text x="215" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">按需安装 · 首次使用才加载</text>
<rect x="350" y="240" width="230" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="465" y="262" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#04342C">公文 Word 插件</text>
<text x="465" y="282" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">MD→DOCX（公文排版）</text>
<text x="465" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">按需安装 · 首次使用才加载</text>
<line x1="215" y1="320" x2="215" y2="360" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="465" y1="320" x2="465" y2="360" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="235" y="344" font-family="sans-serif" font-size="11" fill="#5F5E5A">调用转换脚本</text>
<rect x="100" y="364" width="480" height="86" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="124" y="386" font-family="sans-serif" font-size="13" fill="#2C2C2A">插件自带转换脚本 · 依赖按需安装</text>
<text x="124" y="410" font-family="sans-serif" font-size="11" fill="#5F5E5A">ebooklib / markdown / beautifulsoup4 / html2text / Pillow / python-docx</text>
<text x="124" y="428" font-family="sans-serif" font-size="11" fill="#5F5E5A">平时不加载，干活时才调用，干完即释放</text>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
</svg>
